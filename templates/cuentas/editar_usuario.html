{% extends "base.html" %}

{% block title %}Editar usuario · UniPass{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 640px;">
    <a href="{% url 'lista_usuarios' %}" class="btn btn-outline-secondary btn-sm mb-3">Volver</a>
    <h1 class="h3 fw-bold mb-3">Editar usuario: {{ usuario_editado.username }}</h1>
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                {% if not solo_lectura %}
                <button type="submit" class="btn btn-primary">Guardar cambios</button>
                {% endif %}
            </form>
        </div>
    </div>
</div>
{% endblock %}
