{% extends "base.html" %}

{% block title %}Registrar bicicleta · UniPass{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 720px;">
    <a href="{% url 'mis_bicicletas' %}" class="btn btn-outline-secondary mb-3">Volver</a>
    <h1 class="h3 fw-bold mb-3">Registrar bicicleta</h1>
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success">Guardar</button>
            </form>
        </div>
    </div>
</div>
<link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const selectAlumno = document.querySelector("form select");
    if (selectAlumno) {
        new TomSelect(selectAlumno, {
            create: false,
            sortField: { field: "text", direction: "asc" },
            placeholder: "Escribe nombre o matrícula para buscar..."
        });
    }
});
</script>
{% endblock %}
