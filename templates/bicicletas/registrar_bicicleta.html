<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Bicicleta - UniPass</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2>Registrar Nueva Bicicleta</h2>
    <form method="POST" class="mt-4">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Número de Folio</label>
            {{ form.numero_folio }}
        </div>
        <div class="mb-3">
            <label class="form-label">Marca</label>
            {{ form.marca }}
        </div>
        <div class="mb-3">
            <label class="form-label">Color</label>
            {{ form.color }}
        </div>
        <button type="submit" class="btn btn-primary">Guardar Bicicleta</button>
    </form>
</body>
</html>
